<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Desapego da Mudança</title>
<style>
:root{--bg:#f6f4ef;--surface:#fff;--text:#171717;--muted:#6f6f6f;--line:#e7e2d9;--accent:#1f4b3f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}.container{width:min(1180px,calc(100% - 32px));margin:auto}.header{padding:28px 0 18px}.eyebrow{text-transform:uppercase;letter-spacing:.12em;font-size:12px;font-weight:700;color:var(--accent)}h1{margin:8px 0;font-size:clamp(32px,7vw,56px);line-height:1;letter-spacing:-.04em}.subtitle{margin:0;color:var(--muted);line-height:1.6;max-width:620px}.filters{display:flex;gap:8px;overflow:auto;padding:14px 0 26px}.filters button{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 15px}.filters button.active{background:var(--accent);color:#fff;border-color:var(--accent)}.grid{display:grid;grid-template-columns:1fr;gap:22px;padding-bottom:100px}.card{background:#fff;border-radius:20px;overflow:hidden;border:1px solid var(--line);box-shadow:0 8px 26px #0000000a}.main{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;cursor:zoom-in}.thumbs{display:flex;gap:8px;padding:10px 14px 0;overflow:auto}.thumb{width:64px;height:52px;object-fit:cover;border-radius:9px;border:2px solid transparent;opacity:.72;cursor:pointer}.thumb.active{opacity:1;border-color:var(--accent)}.body{padding:18px 16px 16px}.cat{color:var(--accent);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.08em}.name{margin:6px 0;font-size:21px}.price{font-size:24px;font-weight:800;margin-bottom:12px}.desc,.dims{color:var(--muted);line-height:1.5;margin:0 0 7px}.ref{display:inline-block;margin-top:5px;color:var(--accent);font-weight:700;text-decoration:underline;text-underline-offset:3px}.actions{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:16px}.buy,.share{border-radius:12px}.buy{border:0;background:var(--accent);color:#fff;padding:14px 18px;font-weight:800}.share{width:48px;border:1px solid var(--line);background:#fff}.overlay,.lightbox{position:fixed;inset:0;z-index:10;background:#0009;display:grid;place-items:end center;padding:14px}.modal{width:min(100%,460px);background:#fff;border-radius:22px;padding:22px}.modal p{color:var(--muted);line-height:1.5}.modalProduct{border-block:1px solid var(--line);padding:14px 0;margin:16px 0}.modalActions{display:grid;gap:10px}.wa,.cancel{border-radius:12px;padding:14px;font-weight:800;text-align:center}.wa{background:#1f9d55;color:#fff;border:0;text-decoration:none}.cancel{background:#fff;border:1px solid var(--line)}.lightbox{place-items:center;background:#000e}.lightbox img{max-width:100%;max-height:86vh;border-radius:12px}.floating{position:fixed;right:18px;bottom:18px;width:58px;height:58px;border-radius:50%;background:#1f9d55;color:#fff;display:grid;place-items:center;text-decoration:none;font-size:26px;box-shadow:0 12px 24px #0003}.hidden{display:none!important}@media(min-width:720px){.grid{grid-template-columns:repeat(2,1fr)}.overlay{place-items:center}.floating{display:none}}@media(min-width:1060px){.grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<header class="header"><div class="container"><div class="eyebrow">Mudança à vista</div><h1>Desapego da mudança</h1><p class="subtitle">Móveis e itens que fizeram parte da nossa casa e agora podem ganhar um novo lar.</p><div class="filters" id="filters"></div></div></header>
<main class="container"><section class="grid" id="grid"></section></main>
<a class="floating" id="floating" target="_blank">◉</a>
<div class="overlay hidden" id="modal"><section class="modal"><h2>Tenho interesse</h2><p>Para comprar este item, fale comigo pelo WhatsApp. A mensagem já vai com o produto preenchido.</p><div class="modalProduct" id="modalProduct"></div><div class="modalActions"><a class="wa" id="wa" target="_blank">Falar pelo WhatsApp</a><button class="cancel" onclick="closeModal()">Cancelar</button></div></section></div>
<div class="lightbox hidden" id="lightbox" onclick="this.classList.add('hidden')"><img id="lightboxImg" onclick="event.stopPropagation()"></div>
<script>
const WHATSAPP_NUMBER='5579999999999'; // TROQUE PELO SEU
const products=[
{id:'mesa-redonda-mendoza',name:'Mesa Redonda Mendoza 1,30 m',price:2500,category:'Sala',description:'Mesa em MDF revestido com lâmina natural de cinamomo e acabamento em verniz poliuretano. Tampo de 25 mm. Carga máxima de 30 kg. Cadeiras das fotos vendidas separadamente por R$ 300 cada.',dimensions:'Ø 1,30 m × 77 cm de altura • Peso: 46,5 kg',referenceUrl:'https://www.tokstok.com.br/mesa-redonda-1-30-m-nozes-mendoza/p?idsku=392716&region_id=000003&utm_source=google&utm_medium=cpc&utm_campaign=18246975493&utm_term=&gad_source=1&gad_campaignid=18245623617&gbraid=0AAAAADGVPjUjaLgs7SCqP7Vpg_ZEOZKdc&gclid=CjwKCAjwsrbTBhAvEiwA0Bpp4cmudKG6x9SC4u4fTtVs0PzRstmi6a-0twTUkonglyATZ1s_8zzUvRoCKOsQAvD_BwE',images:['public/products/mesa-mendoza/03.jpeg','public/products/mesa-mendoza/04.jpeg','public/products/mesa-mendoza/05.jpeg','public/products/mesa-mendoza/06.jpeg','public/products/mesa-mendoza/02.jpeg','public/products/mesa-mendoza/01.jpeg']}
];
const brl=v=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0}).format(v);const cats=['Todos','Sala','Quarto','Escritório','Eletrodomésticos'];let selected='Todos';
function wa(msg){return `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`}
function renderFilters(){filters.innerHTML=cats.map(c=>`<button class="${selected===c?'active':''}" onclick="selected='${c}';renderFilters();render()">${c}</button>`).join('')}
function render(){const list=selected==='Todos'?products:products.filter(p=>p.category===selected);grid.innerHTML=list.map(p=>`<article class="card" id="${p.id}"><img class="main" id="main-${p.id}" src="${p.images[0]}" onclick="expand(this.src)"><div class="thumbs">${p.images.map((im,i)=>`<img class="thumb ${i===0?'active':''}" src="${im}" onclick="changeImage('${p.id}',this,'${im}')">`).join('')}</div><div class="body"><div class="cat">${p.category}</div><h2 class="name">${p.name}</h2><div class="price">${brl(p.price)}</div><p class="desc">${p.description}</p>${p.dimensions?`<p class="dims"><b>Dimensões:</b> ${p.dimensions}</p>`:''}${p.referenceUrl?`<a class="ref" href="${p.referenceUrl}" target="_blank" rel="noopener noreferrer">Ver produto na Tok&Stok ↗</a>`:''}<div class="actions"><button class="buy" onclick="buy('${p.id}')">Comprar</button><button class="share" onclick="shareItem('${p.id}')">↗</button></div></div></article>`).join('')}
function changeImage(id,el,src){document.getElementById('main-'+id).src=src;el.parentNode.querySelectorAll('.thumb').forEach(x=>x.classList.remove('active'));el.classList.add('active')}
function expand(src){lightboxImg.src=src;lightbox.classList.remove('hidden')}
function buy(id){const p=products.find(x=>x.id===id);modalProduct.innerHTML=`<strong>${p.name}</strong><div>${brl(p.price)}</div>`;document.getElementById('wa').href=wa(`Olá! Tenho interesse no ${p.name}, anunciado por ${brl(p.price)}. Ele ainda está disponível?`);modal.classList.remove('hidden')}
function closeModal(){modal.classList.add('hidden')}
async function shareItem(id){const p=products.find(x=>x.id===id);const url=location.href.split('#')[0]+'#'+id;if(navigator.share){await navigator.share({title:p.name,text:`${p.name} — ${brl(p.price)}`,url})}else{await navigator.clipboard.writeText(url);alert('Link do item copiado!')}}
floating.href=wa('Olá! Vi o seu site de desapego e queria saber mais sobre os itens disponíveis.');renderFilters();render();
</script>
</body></html>
